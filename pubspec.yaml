name: senhorita
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  firebase_storage: ^14.1.0

  printing: ^5.15.1
  pdf: ^3.13.1
  barcode: ^2.2.9
  barcode_image: ^2.0.3
  barcode_widget: ^2.0.4
  image: ^4.13.1
  image_picker: ^1.2.4

  cupertino_icons: ^2.0.0
  flutter_multi_formatter: ^2.13.11
  intl: ^0.20.2
  fl_chart: ^1.3.1
  csv: ^8.0.0
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  diacritic: ^0.1.6
  window_manager: ^0.7.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  http: ^1.6.0
  file_picker: ^13.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
    - assets/logosenhorita.png
